<style>
/* Força maiúscula no placeholder de pesquisa */
input[placeholder*="O que"]::placeholder { text-transform: none !important; }
input::placeholder { font-size: 13px !important; }
/* Botões Sr - força texto pequeno e centralizado */
button[style*="34px"] { 
  font-size: 10.5px !important; 
  font-weight: 600 !important; 
  line-height: 1 !important; 
  display: inline-flex !important; 
  align-items: center !important; 
  justify-content: center !important; 
  text-align: center !important;
  letter-spacing: 0.02em !important;
}
</style>
<meta name="theme-color" content="#FFFEF9" id="theme-color-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html, body {
  background: #FFFEF9 !important;
  background-color: #FFFEF9 !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  max-width: 100% !important;
  height: 100% !important;
  position: fixed; /* Trava a estrutura base para o iPhone não "desconectar" o topo */
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden !important;
  transition: background-color 0.3s ease;
}

#root, [id="root"], main, .app-root {
  width: 100%;
  max-width: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
/* Previne o efeito mola no container com rolagem */
.screen-scrollable {
  height: 100dvh;
  height: 100vh;
  width: 100%;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch; /* Garante rolagem nativa e fluida no iOS */
}

/* Para a tela Star (sem rolagem e sem efeito mola) */
.screen-fixed {
  height: 100dvh;
  height: 100vh; /* Fallback de compatibilidade */
  width: 100%;
  overflow: hidden !important;
}

/* Imagem da tela Star sangrando até as bordas da tela */
.star-bg-full {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100dvh;
  object-fit: cover;
  object-position: center;
  margin-top: calc(-1 * env(safe-area-inset-top));
  z-index: 0;
}

/* Tema Dark / Modo Sol */
  body.dark,
  body.dark #root {
    background-color: #0E0E0E !important;
    background: #0E0E0E !important;
  }

  body.sun-mode,
  body.sun-mode #root {
    background-color: #0A0A0A !important;
    background: #0A0A0A !important;
  }
</style>
</head>

<body style="background: #FFFEF9; margin: 0;">
  <div id="root"></div>

  <script>
    // Função para mudar a cor da barra de status e classe do corpo
    window.updateAppTheme = function(theme) {
      var metaThemeColor = document.querySelector('meta[name="theme-color"]');

      if (theme === 'dark') {
        document.body.classList.remove('sun-mode');
        document.body.classList.add('dark');
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#0E0E0E');
      } else if (theme === 'sun') {
        document.body.classList.remove('dark');
        document.body.classList.add('sun-mode');
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#0A0A0A');
      } else {
        // Light (Padrão)
        document.body.classList.remove('dark', 'sun-mode');
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#FFFEF9');
      }
    };
  </script>
</body>
