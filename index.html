<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel JOJO</title>

  <!-- Todos os seus estilos CSS e fontes entram AQUI dentro -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    html, body {
      background-color: #FFFEF9 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    #root {
      width: 100%;
      min-height: 100dvh;
    }

    /* As suas classes CSS personalizadas */
    .card-glass {
      backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
  </style>
</head>

<body>
  <!-- Ponto de montagem da aplicação React -->
  <div id="root"></div>

  <!-- Apenas os seus scripts de aplicação e tema -->
  <script>
    window.updateAppTheme = function(theme) {
      var metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (theme === 'dark') {
        document.body.classList.remove('sun-mode');
        document.body.classList.add('dark');
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#0E0E0E');
      } else {
        document.body.classList.remove('dark', 'sun-mode');
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#FFFEF9');
      }
    };
  </script>
</body>
</html>
