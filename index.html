<style>
/* Força o aplicativo a ocupar 100% da tela do ecrã no iPhone, removendo o mockup */
/* Cor de fundo dinâmica nativa para o sistema iOS/Android */
html {
  background-color: #FFFEF9;
}

@media (prefers-color-scheme: dark) {
  html {
    background-color: #0E0E0E;
  }
}

html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  overflow-x: hidden;
}

#root, #root > div {
  width: 100% !important;
  max-width: 100% !important;
  min-height: 100dvh !important;
  margin: 0 !important;
  padding: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  border: none !important;
}

div.min-h-screen.w-full.flex.items-center.justify-center {
  padding: 0 !important;
  display: block !important;
  background-color: transparent !important;
}

/* Remove cantos arredondados, margens e sombras do cartão interno do app */
div.min-h-screen.w-full.flex.items-center.justify-center > div {
  /* Força a imagem da tela inicial (pirâmides) a cobrir 100% da tela sem cantos arredondados */
img, .hero-image, [class*="pyramid"], [class*="hero"] {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 0 !important;
  max-width: none !important;
}
  max-width: 100% !important;
  width: 100% !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  border: none !important;
  margin: 0 !important;
}

/* Regras anteriores mantidas */
input[placeholder*="O que"]::placeholder { text-transform: none !important; }
input::placeholder { font-size: 13px !important; }

button[style*="34px"] {
  font-size: 10.5px !important;
  font-weight: 600 !important;
  line-height: 1 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center !important;
  letter-spacing: 0.02em !important;
}
</style>
